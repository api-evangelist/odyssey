aid: odyssey
name: Odyssey
description: >-
  Odyssey is an AI research lab pioneering general-purpose world models — causal,
  multimodal systems that learn to understand and simulate the world beyond language.
  Its flagship, Odyssey-2 Pro, is a frontier world model that outputs continuous,
  interactive, multi-minute video simulations in real time from text or image
  prompts. Odyssey exposes this as a developer API: three surfaces (interactive
  streams, viewable/broadcast streams, and asynchronous simulations) delivered over
  WebRTC media plus a WebSocket signaling channel, driven by official JavaScript/
  TypeScript and Python SDKs. Auth is an `ody_` API key with a client-credentials
  pattern that mints short-lived session JWTs so browsers can connect without
  exposing the key. Odyssey is backed by a16z, EQT Ventures, General Catalyst, GV,
  and Union Square Ventures and is based in Menlo Park, California.
